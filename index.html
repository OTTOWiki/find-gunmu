<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#030206">
<title>寻找棍母 · 充能面包版</title>
<!-- 样式：css/style.css ｜ 逻辑：js/*.js（ES Module，入口 js/boot.js） -->
<link rel="stylesheet" href="css/style.css">
</head>
<body data-state="start">
<div id="wrap">
  <div id="diag"></div>
  <div id="vignette"></div><div id="flash"></div><div id="crosshair"></div>

  <div id="hud">
    <div id="hud-top">
      <span><span id="lb-level">层级</span>: <b id="h-level">1</b></span><span>|</span>
      <span><span id="lb-goal">目标</span>: <b id="h-goal">0/5</b></span><span>|</span>
      <span id="h-time">01:30</span><span>|</span>
      <span id="h-spd">0.0 m/s</span>
      <span id="hud-stats"><span id="h-gpm">GPM×10 0</span><span> ｜ </span><span id="h-wapm">WAPM×10 0</span></span>
    </div>
    <div id="hud-bottom" class="desktop-only">
      <span class="cd-pill ready" id="pill-guide"></span>
      <span class="cd-pill ready" id="pill-box"></span>
      <span class="cd-pill ready" id="pill-nut"></span>
      <span class="cd-pill ready" id="pill-dash"></span>
    </div>
  </div>

  <div id="mobile-controls">
    <div id="look-zone"></div>
    <div id="joy-zone"></div>
    <div id="skills">
      <button class="skill" id="sk-nut"><span class="ico">🌰</span><span class="lb" id="sk-lb-nut"></span><i class="cd"></i></button>
      <button class="skill big" id="sk-box"><span class="ico">🥟</span><span class="lb" id="sk-lb-box"></span><i class="cd"></i></button>
      <button class="skill dash" id="sk-dash"><span class="ico">🦽</span><span class="lb" id="sk-lb-dash"></span><i class="cd"></i></button>
      <button class="skill big jump" id="sk-jump"><span class="ico">⬆️</span><span class="lb" id="sk-lb-jump"></span></button>
    </div>
    <button id="btn-fs">⛶</button>
  </div>
  <button id="btn-exit">退出</button>
  <div id="toast" class="touch-only"></div>

  <div id="screen-start" class="screen">
    <div class="menu-inner">
      <h1 id="st-h1">寻找棍母 <span id="st-tag">超能漫步版</span></h1>
      <div class="bang" id="st-bang">!寻找棍母!</div>
      <p class="lead"><span id="st-lead1">穿梭飞门，在暗影回廊中寻回你的 </span><b id="blank">_________</b><span id="st-lead2"> ...</span></p>
      <div id="st-menu">
        <button class="menu-btn primary" id="btn-mode-normal">
          <b id="btn-mode-normal-t">正式模式</b><i id="btn-mode-normal-d">90 秒 · 冲击更深层级</i>
        </button>
        <button class="menu-btn" id="btn-mode-practice">
          <b id="btn-mode-practice-t">练习模式</b><i id="btn-mode-practice-d">时间不限 · 自由探索</i>
        </button>
      </div>
      <div id="st-rules">
        <p class="hint" id="st-rule-1"></p>
        <p class="hint" id="st-rule-2"></p>
        <p class="hint" id="st-rule-3"></p>
      </div>
      <div id="st-settings"><button class="mini-btn" id="btn-sound">音效：开</button></div>
      <p class="hint desktop-only" id="st-hint-d"></p>
      <p class="hint touch-only" id="st-hint-t"></p>
      <div class="foot" id="st-foot"></div>
    </div>
  </div>
  <div id="screen-gate" class="screen"><div class="gate-text" id="gate-text"></div></div>
  <div id="screen-lost" class="screen">
    <h2 id="lost-title"></h2>
    <p class="stats"><span id="lost-lb-lv">到达层级</span> <b id="lost-level">1</b> ｜ <span id="lost-lb-cnt">收集棍母</span> <b id="lost-count">0</b></p>
    <div id="lost-btns">
      <button id="btn-retry"></button>
      <button id="btn-menu"></button>
    </div>
    <div class="foot" id="lost-foot"></div>
  </div>
</div>

<!-- CDN 容灾加载 three.js / GLTFLoader / nipplejs / tween.js，随后动态 import 游戏本体 -->
<script type="module" src="js/boot.js"></script>
</body>
</html>
