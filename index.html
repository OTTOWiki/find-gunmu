<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#030206">
<title>寻找棍母 · 充能面包版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  position:fixed;inset:0;overflow:hidden;background:#030206;
  overscroll-behavior:none;touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:#f0e6ff;
}
#wrap{position:fixed;inset:0}
canvas{position:absolute;inset:0;display:block}

#vignette{
  position:absolute;inset:0;z-index:12;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 40%,rgba(2,1,4,.85) 100%);
  box-shadow:inset 0 0 100px rgba(0,0,0,.8);
}
body.danger #vignette{animation:pulse-danger .6s infinite alternate}
@keyframes pulse-danger{0%{background:radial-gradient(ellipse at center,transparent 30%,rgba(180,10,30,.5) 100%)}100%{background:radial-gradient(ellipse at center,transparent 20%,rgba(220,10,40,.85) 100%)}}

#flash{position:absolute;inset:0;z-index:13;pointer-events:none;background:#ff1133;opacity:0;transition:opacity .35s ease-out}
#flash.on{opacity:.65;transition:none}
#crosshair{
  position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;
  background:#fff;z-index:14;pointer-events:none;box-shadow:0 0 12px #ff4400,0 0 4px #fff;
  transition:transform .08s ease;
}

#diag{
  position:absolute;top:calc(6px + env(safe-area-inset-top));left:8px;z-index:55;pointer-events:none;
  font:10px/1.4 ui-monospace,Consolas,monospace;color:#a89bc5;opacity:.85;max-width:75vw;white-space:pre-wrap;
  text-shadow:0 1px 3px #000;
}

#hud{position:absolute;inset:0;z-index:15;pointer-events:none;opacity:0;transition:opacity .3s}
body[data-state="playing"] #hud,body[data-state="gate"] #hud{opacity:1}
#hud-top{
  position:absolute;top:0;left:0;right:0;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;
  gap:4px 16px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  font-family:ui-monospace,Consolas,monospace;font-size:clamp(14px,3.2vw,18px);font-weight:700;
  letter-spacing:1.5px;text-shadow:0 0 12px rgba(180,110,255,.9),0 2px 4px #000;
  background:linear-gradient(rgba(3,2,6,.95),rgba(3,2,6,.4) 70%,transparent);
}
#hud-top b{color:#d8b5ff}
#h-time{color:#77ffaa;transition:color .2s}
#h-time.low{color:#ff3355;animation:blink .4s infinite;text-shadow:0 0 16px #ff1133}
@keyframes blink{50%{opacity:.25}}
#h-spd{color:#70dcff}
#hud-bottom{
  position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;
  display:flex;justify-content:center;gap:12px;flex-wrap:wrap;
  font-size:12px;color:#a89bc5;font-family:ui-monospace,monospace;
}
.cd-pill{
  background:rgba(15,10,25,.85);border:1px solid #5a428c;border-radius:20px;padding:6px 16px;
  backdrop-filter:blur(6px);box-shadow:0 4px 12px rgba(0,0,0,.6);transition:all .2s;
}
.cd-pill.ready{color:#77ffaa;border-color:#388050;box-shadow:0 0 10px rgba(119,255,170,.3)}
.cd-pill.act{color:#ffc850;border-color:#d49824;box-shadow:0 0 15px rgba(255,200,80,.5);transform:scale(1.05)}
body.touch .desktop-only{display:none!important}
body:not(.touch) .touch-only{display:none!important}

.floatmsg{
  position:absolute;left:50%;top:32%;transform:translateX(-50%);z-index:16;pointer-events:none;
  color:#ffe066;font-weight:900;font-size:clamp(22px,6vw,32px);
  text-shadow:0 0 16px rgba(255,210,50,.9),0 2px 6px #000;
  animation:fmsg 1.1s cubic-bezier(.15,.9,.3,1.2) forwards;white-space:nowrap;
}
@keyframes fmsg{0%{opacity:0;transform:translate(-50%,20px) scale(.7)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}80%{opacity:1;transform:translate(-50%,-20px) scale(1)}100%{opacity:0;transform:translate(-50%,-60px) scale(.9)}}

#mobile-controls{position:absolute;inset:0;z-index:20;display:none;pointer-events:none}
body.touch[data-state="playing"] #mobile-controls{display:block}
#look-zone{position:absolute;right:0;top:0;width:50%;height:100%;pointer-events:auto}
#joy-zone{position:absolute;left:0;top:0;width:50%;height:100%;pointer-events:auto}

#skills{
  position:absolute;right:calc(14px + env(safe-area-inset-right));
  bottom:calc(16px + env(safe-area-inset-bottom));
  display:flex;align-items:flex-end;gap:12px;pointer-events:auto;
}
.skill{
  position:relative;width:clamp(52px,13.5vw,66px);height:clamp(52px,13.5vw,66px);border-radius:50%;
  border:2px solid #8e62d4;background:rgba(25,15,44,.85);color:#f0e6ff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-family:inherit;touch-action:none;box-shadow:0 6px 16px rgba(0,0,0,.7);transition:transform .08s;
}
.skill.big{width:clamp(66px,17vw,82px);height:clamp(66px,17vw,82px)}
.skill.jump{border-color:#4ac0ff;box-shadow:0 0 20px rgba(74,192,255,.5)}
.skill.dash{border-color:#ff9933;box-shadow:0 0 20px rgba(255,153,51,.5)}
.skill .ico{font-size:clamp(20px,5.2vw,26px);line-height:1}
.skill .lb{font-size:clamp(10px,2.5vw,12px);font-weight:bold;opacity:.95}
.skill .cd{position:absolute;inset:-2px;border-radius:50%;pointer-events:none}
.skill:active{transform:scale(.88)}
#btn-fs{
  position:absolute;top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));
  width:42px;height:42px;border-radius:12px;border:1px solid #6b4fa3;background:rgba(20,12,36,.8);
  color:#d8b5ff;font-size:22px;pointer-events:auto;z-index:21;
}
#toast{
  position:absolute;top:18%;left:50%;transform:translateX(-50%);z-index:25;pointer-events:none;
  background:rgba(18,10,32,.95);border:1px solid #855ec9;border-radius:16px;
  padding:14px 26px;font-size:clamp(14px,3.6vw,17px);font-weight:bold;opacity:0;transition:opacity .3s;white-space:nowrap;
  box-shadow:0 6px 24px rgba(0,0,0,.8),0 0 15px rgba(133,94,201,.4);
}
#toast.show{opacity:1}

.screen{
  position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;text-align:center;padding:24px;
  background:radial-gradient(ellipse at center,#1d1038 0%,#040208 85%);
  opacity:0;pointer-events:none;transition:opacity .4s cubic-bezier(.2,.8,.4,1);
}
body[data-state="start"] #screen-start,
body[data-state="lost"]  #screen-lost,
body[data-state="gate"]  #screen-gate{opacity:1;pointer-events:auto}
#screen-start h1{font-size:clamp(34px,9vw,60px);font-weight:900;letter-spacing:6px;text-shadow:0 0 25px #9944ff,0 0 60px #5500aa}
#screen-start h1 span{font-size:.45em;color:#ffaa33;border:2px solid #ffaa33;border-radius:10px;padding:3px 12px;vertical-align:middle;box-shadow:0 0 12px rgba(255,170,51,.4)}
.bang{color:#ff3355;font-size:clamp(16px,4.5vw,24px);letter-spacing:5px;font-weight:800;text-shadow:0 0 16px #ff3355}
.lead{font-size:clamp(15px,4.2vw,20px);color:#d0c2ee;line-height:1.9;max-width:88vw}
#blank{color:#ffcc00;font-weight:900;text-shadow:0 0 14px #ffcc00}
.hint{font-size:clamp(12px,3vw,14px);color:#a89bc5;font-family:ui-monospace,monospace;max-width:92vw}
.foot{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));font-size:12px;color:#6d5994;font-family:ui-monospace,monospace}
#screen-gate{background:radial-gradient(ellipse at center,rgba(130,40,240,.7),rgba(4,2,8,.98) 85%)}
.gate-text{font-size:clamp(22px,6.5vw,38px);font-weight:900;letter-spacing:5px;color:#f5ebff;text-shadow:0 0 30px #b06aff;animation:pulse-danger 1s infinite alternate}
#screen-lost h2{font-size:clamp(30px,8vw,52px);font-weight:900;color:#ff3355;letter-spacing:5px;text-shadow:0 0 25px #ff1133}
.stats{color:#d0c2ee;font-size:clamp(15px,4vw,20px)}
.stats b{color:#ffcc00}
#btn-retry{
  margin-top:14px;padding:16px 52px;font-size:clamp(17px,4.8vw,22px);font-weight:800;letter-spacing:4px;
  background:#5219a8;color:#fff;border:2px solid #b87aff;border-radius:16px;font-family:inherit;
  box-shadow:0 0 32px rgba(184,122,255,.6),0 6px 16px rgba(0,0,0,.6);cursor:pointer;transition:transform .1s;
}
#btn-retry:active{transform:scale(.94)}
</style>
</head>
<body data-state="start">

    <button id="btn-retry"></button>
    <div class="foot" id="lost-foot"></div>
  </div>
</div>

<script>
/* ==========================================================================
   MODULE 0: 全局单一字符串字典 (Centralized String Dictionary)(禁止修改)
   ========================================================================== */
window.GAME_STRINGS = {
  // 基础与窗口标题

  lostLevelLabel: '到达层级',
  lostCountLabel: '收集棍母',
  btnRetry: '重新挑战',

  // 技能按钮名称
  skNut: '槟榔',
  skBox: '韭菜盒子',
  skDash: '冲刺',
  skJump: '飞',

  // HUD 桌面端按键与冷却提示
  desktopControlsGuide: 'WASD 移动 | 鼠标 转向 | 左键 韭菜盒子 | 右键 槟榔 | 空格 连跳甩尾 | Q 轮椅猛冲',
  pillBoxReady: '左键 韭菜盒子 就绪',
  pillBoxCd: function(s){ return '左键 韭菜盒子 ' + s + 's'; },
  pillNutReady: '右键 槟榔 就绪',
  pillNutActive: '右键 槟榔 狂暴加速!',
  pillNutCd: function(s){ return '右键 槟榔 ' + s + 's'; },
  pillDashReady: 'Q 轮椅猛冲 就绪',
  pillDashActive: 'Q 冲刺!',
  pillDashCd: function(s){ return 'Q 冲刺 ' + s + 's'; },

  // HUD 动态文本片段
  hudMeterUnit: 'm',
  hudSpeedUnit: ' m/s @ ',

  // 浮动战况飘字消息
  msgJumpCombo: function(c){ return '⚡ 飞' + c+'分钱'; },
  msgNutBoost: '🌰 wc槟！',
  msgDashSmash: '💥 我创撕你的面!',
  msgCollect: '✨ 棍母 +1',
  msgHurt: '💀 哇袄 -5秒!',
  msgBoxHit: '🎯 击败!',

  // 诊断与运行错误告警
  diagInit: '别急...',
  diagLoadingLibs: '正在加载lib...',
  diagWebGLError: '⚠ WebGL 不可用，请开启浏览器硬件加速',
  diagModelFallback: 'daoli.glb 加载跳过，启用保底模型',
  diagCoreLibBlocked: '⚠ Three.js 核心库加载受阻，请检查网络',
  diagBootErrorPrefix: '⚠ 启动异常: ',
  diagDiagPrefix: '干飞马 · ',

  // 模块异常标签
  errTagModel: '模型解析',
  errTagGLTF: 'GLTF',
  errTagGate: '飞门',
  errTagLevel: '关卡',
  errTagPhysics: '物理',
  errTagRender: '渲染',
  errTagFrame: '帧',
  errTagPost: '后期',
  errTagInit: '初始化'
};

var STR = window.GAME_STRINGS;

window.startGame=function(){
var $=function(id){return document.getElementById(id);};
var W=innerWidth,H=innerHeight;
var isTouch=matchMedia('(pointer:coarse)').matches||(('ontouchstart'in window)&&navigator.maxTouchPoints>0);
if(isTouch)document.body.classList.add('touch');
window.addEventListener('touchstart',function(){if(!isTouch){isTouch=true;document.body.classList.add('touch');}},{once:true,passive:true});

// 将字典文本注入静态 DOM
function applyStaticStrings(){
  document.title=STR.docTitle;
  $('diag').textContent=STR.diagInit;
  $('lb-level').textContent=STR.hudLevel;
  $('lb-goal').textContent=STR.hudGoal;
  $('pill-guide').textContent=STR.desktopControlsGuide;
  $('pill-box').textContent=STR.pillBoxReady;
  $('pill-nut').textContent=STR.pillNutReady;
  $('pill-dash').textContent=STR.pillDashReady;
  $('sk-lb-nut').textContent=STR.skNut;
  $('sk-lb-box').textContent=STR.skBox;
  $('sk-lb-dash').textContent=STR.skDash;
  $('sk-lb-jump').textContent=STR.skJump;
  $('toast').textContent=STR.toastTip;
  $('st-h1').childNodes[0].nodeValue=STR.startTitle+' ';
  $('st-tag').textContent=STR.startTag;
  $('st-bang').textContent=STR.startBang;
  $('st-lead1').textContent=STR.startLead1;
  $('st-lead2').textContent=STR.startLead2;
  $('blank').textContent=STR.blankInitial;
  $('st-hint-d').textContent=STR.startHintDesktop;
  $('st-hint-t').textContent=STR.startHintTouch;
  $('st-foot').textContent=STR.engineVersion;
  $('lost-title').textContent=STR.lostTitle;
  $('lost-lb-lv').textContent=STR.lostLevelLabel;
  $('lost-lb-cnt').textContent=STR.lostCountLabel;
  $('btn-retry').textContent=STR.btnRetry;
  $('lost-foot').textContent=STR.engineVersion;
}
applyStaticStrings();

/* ==========================================================================
   MODULE 1: 诊断与振动管理
   ========================================================================== */
var diagErr='',fps=0,errCount=0,lastErr='';
function showErr(tag,e){
  var m=(e&&e.message)?e.message:String(e);
  if(m===lastErr){errCount++;}
  else{lastErr=m;errCount=1;diagErr=tag+': '+m;}
  if(window.console)console.error('['+tag+']',e);
}
function buzz(pattern){
  try{if(navigator.vibrate)navigator.vibrate(pattern);}catch(e){}
}

/* ==========================================================================
   MODULE 2: 空间音频合成引擎
   ========================================================================== */
var ac=null,noiseBuf=null,windGain=null,windFilter=null,skidGain=null,skidFilter=null,droneGain=null,droneOsc=null;
function initAudio(){
  try{
    if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    if(!noiseBuf){
      var len=ac.sampleRate*2;
      noiseBuf=ac.createBuffer(1,len,ac.sampleRate);
      var d=noiseBuf.getChannelData(0);
      for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
    }
    if(!windGain){
      var wSrc=ac.createBufferSource();wSrc.buffer=noiseBuf;wSrc.loop=true;
      windFilter=ac.createBiquadFilter();windFilter.type='bandpass';windFilter.frequency.value=280;windFilter.Q.value=1.2;
      windGain=ac.createGain();windGain.gain.value=0;
      wSrc.connect(windFilter);windFilter.connect(windGain);windGain.connect(ac.destination);
      wSrc.start();
    }
    if(!skidGain){
      var sSrc=ac.createBufferSource();sSrc.buffer=noiseBuf;sSrc.loop=true;
      skidFilter=ac.createBiquadFilter();skidFilter.type='bandpass';skidFilter.frequency.value=1200;skidFilter.Q.value=3.5;
      skidGain=ac.createGain();skidGain.gain.value=0;
      sSrc.connect(skidFilter);skidFilter.connect(skidGain);skidGain.connect(ac.destination);
      sSrc.start();
    }
    if(!droneGain){
      droneOsc=ac.createOscillator();droneOsc.type='sawtooth';droneOsc.frequency.value=48;
      var dFilt=ac.createBiquadFilter();dFilt.type='lowpass';dFilt.frequency.value=110;
      droneGain=ac.createGain();droneGain.gain.value=0.03;
      droneOsc.connect(dFilt);dFilt.connect(droneGain);droneGain.connect(ac.destination);
      droneOsc.start();
    }
  }catch(e){}
}

function playSubBass(fStart,fEnd,dur,vol){
  if(!ac)return;try{
    var t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
    o.type='sine';o.frequency.setValueAtTime(fStart||95,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(15,fEnd||28),t+dur);
    g.gain.setValueAtTime(vol||.35,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur);
  }catch(e){}
}

function playHeavyImpact(strength){
  if(!ac)return;try{
    var t=ac.currentTime;playSubBass(120,25,.35,Math.min(.6,.25+strength*.2));
    if(noiseBuf){
      var src=ac.createBufferSource();src.buffer=noiseBuf;
      var f=ac.createBiquadFilter();f.type='lowpass';
      f.frequency.setValueAtTime(800,t);f.frequency.exponentialRampToValueAtTime(80,t+.2);
      var g=ac.createGain();g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);
      src.connect(f);f.connect(g);g.connect(ac.destination);
      src.start(t,Math.random());src.stop(t+.23);
    }
  }catch(e){}
}

function playStep(alt){
  if(!ac||!noiseBuf)return;try{
    var t=ac.currentTime,src=ac.createBufferSource();src.buffer=noiseBuf;

var PERIOD=48;

function hash2(x,z){var h=Math.sin(x*127.1+z*311.7)*43758.5453;return h-Math.floor(h);}
function vnoiseP(x,z,per){
  var xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi;
  var u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);
  var a=hash2(mod(xi,per),mod(zi,per)),b=hash2(mod(xi+1,per),mod(zi,per)),c=hash2(mod(xi,per),mod(zi+1,per)),d=hash2(mod(xi+1,per),mod(zi+1,per));

}
function cellAt(gx,gz){
  var wx=mod(gx,PERIOD),wz=mod(gz,PERIOD);
  var mx=mod(wx,8),mz=mod(wz,8);
  if(mx<2||mz<2)return 0;
  if(vnoiseP(wx*.25+7.25,wz*.25+3.25,12)>.66)return 0;
  var ex=mod(wx,2),ez=mod(wz,2);
  if(ex===0&&ez===0)return 1;
  if(ex===0||ez===0){
    var dens=.30+.30*vnoiseP(wx*.125+13.75,wz*.125+5.75,6);
    return hash2(wx,wz)<dens?0:1;
  }
  return 0;
}

  floorMesh=new THREE.Mesh(new THREE.PlaneGeometry(160,160),new THREE.MeshLambertMaterial({map:fTex}));
  floorMesh.rotation.x=-Math.PI/2;floorMesh.receiveShadow=SHADOWS;worldRoot.add(floorMesh);

  cTex=gridTex(hue,20);cTex.repeat.set(80,80);
  ceilMesh=new THREE.Mesh(new THREE.PlaneGeometry(160,160),new THREE.MeshLambertMaterial({map:cTex}));
  ceilMesh.rotation.x=Math.PI/2;ceilMesh.position.y=WALL_H;worldRoot.add(ceilMesh);

  for(var i=0;i<5;i++){var gm=makeGunmu();worldRoot.add(gm);itemMeshes.push(gm);}
  var auraMat=new THREE.SpriteMaterial({map:glowTex,color:0xff1838,transparent:true,opacity:.38,blending:THREE.AdditiveBlending,depthWrite:false});
  for(i=0;i<MAXEN;i++){
    var sp=new THREE.Sprite(waaoMat);
    sp.scale.set(1.9*Math.min(Math.max(waaoAspect,.4),1.8),1.9,1);sp.visible=false;
    worldRoot.add(sp);enemySprites.push(sp);
    var au=new THREE.Sprite(auraMat);
    au.scale.set(2.4,2.4,1);au.visible=false;
    worldRoot.add(au);enemyGlows.push(au);
  }
}

function rebuildChunks(force){
  var pcx=Math.floor(p.x/TILE),pcz=Math.floor(p.z/TILE);
  if(!force&&pcx===lastCX&&pcz===lastCZ)return;
  lastCX=pcx;lastCZ=pcz;
  var wi=0,li=0,gi=0;
  for(var gz=pcz-CHUNK_R;gz<=pcz+CHUNK_R;gz++){
    for(var gx=pcx-CHUNK_R;gx<=pcx+CHUNK_R;gx++){
      var wx=(gx+.5)*TILE,wz=(gz+.5)*TILE;
      if(cellAt(gx,gz)===1){
        if(wi<WALLCAP){
          m4.identity();m4.setPosition(wx,WALL_H/2,wz);
          wallInst.setMatrixAt(wi,m4);
          var rnd=hash2(mod(gx,PERIOD)*3.7,mod(gz,PERIOD)*1.3);
          cTmp.setHSL(((hue+rnd*16-8)%360)/360,.38,.28+rnd*.18);
          wallInst.setColorAt(wi,cTmp);
          wi++;
        }
      }else if(mod(gx+gz,3)===0){
        if(li<LIGHTCAP){
          m4.makeRotationX(Math.PI/2);m4.setPosition(wx,WALL_H-.03,wz);
          lightInst.setMatrixAt(li++,m4);
        }
        if(gi<GLOWCAP){
          m4.makeRotationX(Math.PI/2);m4.setPosition(wx,WALL_H-.22,wz);
          glowInst.setMatrixAt(gi++,m4);
        }
      }
    }
  }
  wallInst.count=wi;lightInst.count=li;glowInst.count=gi;
  wallInst.instanceMatrix.needsUpdate=true;
  if(wallInst.instanceColor)wallInst.instanceColor.needsUpdate=true;
  lightInst.instanceMatrix.needsUpdate=true;
  glowInst.instanceMatrix.needsUpdate=true;
}

var state='start',level=1,goal=0,total=0,time=90,hue=260;
var items=[],enemies=[],projs=[];
var boxCD=0,nutCD=0,dashCD=0,nutT=0,dashT=0,last=0,toastShown=false;
var lookDX=0,lookDY=0,touchJump=false;
var camDip=0,fovKick=0,combo=0,bumpCD=0,hurtV=0,boostV=0,speedU=0,impactV=0;
var bobT=0,prevYaw=0,yawVelS=0;
var stepAcc=0,stepAlt=false,keys={};

var trauma=0;
function addTrauma(v){trauma=Math.min(1.0,trauma+v);}

var GRAV=22.5, JUMP=7.0, FRIC=6.4;
var MAXS=9.8, GACC=24;
var AIRACC=36, AIRCAP=2.8;
var AIRMAX=1000;
var DASH_SPD=21.0;

var jumpBufferTimer=0;
var coyoteTimer=0;

var p={x:6,y:0,z:6,vx:0,vy:0,vz:0,yaw:0,pitch:.12,grounded:true,iT:0};
function setState(s){state=s;document.body.dataset.state=s;}

var PR=.35;
function moveWithCollision(o,dx,dz,r){
  var oz=(o.z!==undefined)?o.z:o.y;
  if(!blocked(o.x+dx,oz,r)){
    o.x+=dx;
  }else if(o===p){
    p.vx*=0.4;
  }
  oz=(o.z!==undefined)?o.z:o.y;
  if(!blocked(o.x,oz+dz,r)){
    if(o.z!==undefined)o.z+=dz;else o.y+=dz;
  }else if(o===p){
    p.vz*=0.4;
  }
}
function blocked(x,z,r){return cell(x-r,z-r)===1||cell(x+r,z-r)===1||cell(x-r,z+r)===1||cell(x+r,z+r)===1;}

function accelerate(wx,wz,wishspeed,accel,dt){
  var cur=p.vx*wx+p.vz*wz;
  var add=wishspeed-cur;
  if(add<=0)return;
  var as=accel*dt*wishspeed;
  if(as>add)as=add;
  p.vx+=wx*as;p.vz+=wz*as;
}

function physics(dt){
  if(!isFinite(p.x)||!isFinite(p.z)){p.x=1.5*TILE;p.z=1.5*TILE;p.vx=p.vz=0;}
  var nut=nutT>0?1.55:1;
  var jc=getJoyInput();
  var f=((keys.KeyW||keys.ArrowUp)?1:0)-((keys.KeyS||keys.ArrowDown)?1:0)+jc.y;
  var s=((keys.KeyD||keys.ArrowRight)?1:0)-((keys.KeyA||keys.ArrowLeft)?1:0)+jc.x;
  var len=Math.hypot(f,s);if(len>1){f/=len;s/=len;}
  var mag=Math.min(1,Math.hypot(f,s));
  
  var fwdX=Math.cos(p.yaw),fwdZ=Math.sin(p.yaw);
  var rgtX=-fwdZ,rgtZ=fwdX;
  var wx=fwdX*f+rgtX*s,wz=fwdZ*f+rgtZ*s;
  var wl=Math.hypot(wx,wz);
  if(wl>1e-4){wx/=wl;wz/=wl;}

  if(jumpBufferTimer>0)jumpBufferTimer-=dt;
  if(p.grounded)coyoteTimer=0.12;else if(coyoteTimer>0)coyoteTimer-=dt;

  var jumpHeld=keys.Space||touchJump;
  var wantJump=jumpHeld||jumpBufferTimer>0;

  if((p.grounded||coyoteTimer>0)&&wantJump){
    p.vy=JUMP;p.grounded=false;coyoteTimer=0;jumpBufferTimer=0;
    playSubBass(85,160,.12,.2);
    puff(p.x,.05,p.z,7,.5,.45,.6,1.4);
  }

  if(p.grounded&&!wantJump){
    var sp=Math.hypot(p.vx,p.vz);
    if(sp>0){
      var drop=sp*FRIC*dt;
      var sc=Math.max(0,sp-drop)/sp;
      p.vx*=sc;p.vz*=sc;
    }
    accelerate(wx,wz,MAXS*nut*mag,GACC*nut,dt);
  }else{
    accelerate(wx,wz,wl>1e-4?AIRCAP*nut:0,AIRACC,dt);
    if(wl>1e-4){
      var hsAir=Math.hypot(p.vx,p.vz);
      if(hsAir>0.8){
        var curA=Math.atan2(p.vz,p.vx);
        var wishA=Math.atan2(wz,wx);
        var diff=wishA-curA;
        while(diff>Math.PI)diff-=Math.PI*2;
        while(diff<-Math.PI)diff+=Math.PI*2;
        var maxTurn=(p.grounded?15:5.8)*dt;
        var rot=THREE.MathUtils.clamp(diff,-maxTurn,maxTurn);
        var nextA=curA+rot;
        p.vx=Math.cos(nextA)*hsAir;
        p.vz=Math.sin(nextA)*hsAir;
        if(Math.abs(diff)>0.3&&hsAir>8){
          puff(p.x-Math.cos(nextA)*.4,.1,p.z-Math.sin(nextA)*.4,2,.7,.6,.9,1.8);
        }
      }
    }
    var hs0=Math.hypot(p.vx,p.vz),cap=AIRMAX*nut;
    if(hs0>cap){p.vx*=cap/hs0;p.vz*=cap/hs0;}
  }
  p.vy-=GRAV*dt;

  var fallV=p.vy;
  var ox=p.x,oz=p.z;
  moveWithCollision(p,p.vx*dt,p.vz*dt,PR);
  bumpCD=Math.max(0,bumpCD-dt);
  var lost=Math.abs(p.vx*dt-(p.x-ox))+Math.abs(p.vz*dt-(p.z-oz));
  if(lost>.015&&Math.hypot(p.vx,p.vz)>7&&bumpCD<=0){
    bumpCD=.3;addTrauma(.55);impactV=1;
    playHeavyImpact(1.2);buzz([40,30,40]);
    puff(p.x,.9,p.z,12,.7,.5,.3,3.2);
  }

  p.y+=p.vy*dt;
  if(p.y<=0){
    p.y=0;p.vy=0;
    if(!p.grounded){
      var imp=-fallV;
      if(imp>1.5){
        playLand(imp);
        puff(p.x,.05,p.z,Math.min(32,3+imp*2.2)|0,.6,.55,.7,1.4+imp*.22);
        camDip=Math.min(.45,imp*.032);
        if(imp>8){addTrauma(.45);impactV=Math.min(1,imp*.1);}
      }
      if(wantJump){
        combo++;
        if(combo>=3)msg(STR.msgJumpCombo(combo));
        fovKick=Math.max(fovKick,Math.min(9,2.5+combo*.65));
        var hb=Math.hypot(p.vx,p.vz);
        if(hb>1){
          var hcap=AIRMAX*nut;
          var nb=Math.min(hcap,hb*1.07+.48);
          if(wl>1e-4){
            var curDirX=p.vx/hb,curDirZ=p.vz/hb;
            var steerFactor=0.48;
            var newDirX=curDirX*(1-steerFactor)+wx*steerFactor;
            var newDirZ=curDirZ*(1-steerFactor)+wz*steerFactor;
            var ndl=Math.hypot(newDirX,newDirZ)||1;
            p.vx=(newDirX/ndl)*nb;
            p.vz=(newDirZ/ndl)*nb;
          }else{
            p.vx*=nb/hb;p.vz*=nb/hb;
          }
        }
        p.vy=JUMP;
        p.grounded=false;
        jumpBufferTimer=0;
      }else{
        combo=0;
      }
    }
    if(!wantJump)p.grounded=true;
  }else{
    p.grounded=false;
  }

  var hsd=Math.hypot(p.vx,p.vz);
  if(p.grounded&&hsd>.8){
    stepAcc+=dt*hsd;
    if(stepAcc>2.5){stepAcc-=2.5;stepAlt=!stepAlt;playStep(stepAlt);}
  }else if(p.grounded)stepAcc=0;

  if(dashT>0){
    dashT-=dt;
    puff(p.x-Math.cos(p.yaw)*.6,.3,p.z-Math.sin(p.yaw)*.6,3,.6,.35,1,2.5);
  }
  if(nutT>0)nutT-=dt;
  if(p.iT>0)p.iT-=dt;
}

function setupLevel(lv,fresh){
  level=lv;hue=lv*47+260;
  if(fresh){p.x=1.5*TILE;p.z=1.5*TILE;p.y=0;p.vx=p.vy=p.vz=0;p.iT=0;p.grounded=true;}
  goal=0;time=90;combo=0;mbReset=3;
  jumpBufferTimer=0;coyoteTimer=0;
  projs.forEach(function(pr){if(pr.mesh){worldRoot.remove(pr.mesh);pr.mesh.geometry.dispose();pr.mesh.material.dispose();}});
  projs=[];projMeshes=[];items=[];
  for(var i=0;i<5;i++){
    var s=findSpot(15,55);items.push({x:s.x,y:s.y,taken:false,ph:Math.random()*6.28});
  }
  enemies=[];
  var n=Math.min(7+lv,MAXEN);
  for(i=0;i<n;i++){
    var e=findSpot(20,55);enemies.push({x:e.x,y:e.y,dir:Math.random()*6.28,dirT:0,alive:true,resp:0,ph:Math.random()*6.28});
  }
  scene.background.setHSL((hue%360)/360,.38,.035);
  scene.fog.color.copy(scene.background);
  rebuildChunks(true);
}

function los(ax,az,bx,bz){
  var dx=bx-ax,dz=bz-az,d=Math.hypot(dx,dz),steps=Math.ceil(d/.25);
  for(var i=1;i<steps;i++)if(cell(ax+dx*i/steps,az+dz*i/steps)===1)return false;
  return true;
}

function throwBox(){
  if(state!=='playing'||boxCD>0)return;boxCD=.45;
  var cp=Math.cos(p.pitch);
  var fx=Math.cos(p.yaw)*cp,fy=Math.sin(p.pitch),fz=Math.sin(p.yaw)*cp;
  var m=new THREE.Mesh(new THREE.SphereGeometry(.16,10,8),new THREE.MeshLambertMaterial({color:0xe5af40,emissive:0x664400}));
  m.scale.y=.65;m.position.set(p.x+fx*.5,p.y+1.3,p.z+fz*.5);
  worldRoot.add(m);
  projs.push({x:p.x+fx*.5,y:p.y+1.3,z:p.z+fz*.5,vx:fx*13.5,vy:fy*13.5,vz:fz*13.5,life:1.6,mesh:m});
  puff(p.x+fx*.5,p.y+1.3,p.z+fz*.5,5,.9,.75,.3,2);
  playThrowSFX();buzz(16);
}

function eatNut(){
  if(state!=='playing'||nutCD>0)return;nutCD=8;nutT=3.2;
  msg(STR.msgNutBoost);
  playNutSFX();buzz([30,40,60]);
}

function doDash(){
  if(state!=='playing'||dashCD>0)return;dashCD=5;dashT=.48;
  addTrauma(.7);fovKick=9.5;impactV=1;
  var hs=Math.hypot(p.vx,p.vz),t=Math.max(hs,DASH_SPD);
  p.vx=Math.cos(p.yaw)*t;p.vz=Math.sin(p.yaw)*t;
  p.vy=Math.max(p.vy,2.0);
  puff(p.x-Math.cos(p.yaw)*.6,.4,p.z-Math.sin(p.yaw)*.6,22,.65,.45,1,3.8);
  playDashSFX();buzz([50,40,80]);
}

function msg(t){
  var d=document.createElement('div');d.className='floatmsg';d.textContent=t;
  $('wrap').appendChild(d);setTimeout(function(){d.remove&&d.remove();},1100);
}

function killEnemy(en){
  en.alive=false;en.resp=4+Math.random()*2;
  puff(en.x,.9,en.y,20,.6,.2,.8,3.2);
  playHeavyImpact(1.4);addTrauma(.45);

function flashRed(){var f=$('flash');f.classList.add('on');setTimeout(function(){f.classList.remove('on');},90);}

function collect(it){
  it.taken=true;goal++;total++;msg(STR.msgCollect);
  puff(it.x,.8,it.y,24,1,.85,.35,3.6);
  playCollectSFX();buzz([20,30,40]);
  if(goal>=5){levelClear();return;}
  var s=findSpot(20,60);
  it.x=s.x;it.y=s.y;it.taken=false;it.ph=Math.random()*6.28;
}

var gateTimer=null;
function gate(txt,dur,cb){
  setState('gate');$('gate-text').innerHTML=txt;
  clearTimeout(gateTimer);
  gateTimer=setTimeout(function(){
    try{cb&&cb();}catch(e){showErr(STR.errTagGate,e);setState('playing');}
  },dur);

function startRun(){total=0;gate(STR.gateEntering,1000,function(){try{setupLevel(1,true);}catch(e){showErr(STR.errTagLevel,e);}setState('playing');});}

function lose(){setState('lost');$('lost-level').textContent=level;$('lost-count').textContent=total;playHurtSFX();buzz(120);}

function entities(dt){
  boxCD=Math.max(0,boxCD-dt);nutCD=Math.max(0,nutCD-dt);dashCD=Math.max(0,dashCD-dt);
  items.forEach(function(it){
    if(!it.taken&&(p.x-it.x)*(p.x-it.x)+(p.z-it.y)*(p.z-it.y)<.42)collect(it);
  });
  enemies.forEach(function(en){
    if(!en.alive){
      en.resp-=dt;
      if(en.resp<=0){
        var d0=Math.hypot(p.x-en.x,p.z-en.y);
        if(d0>80){var s0=findSpot(30,55);en.x=s0.x;en.y=s0.y;}
        en.alive=true;
      }
      return;
    }
    var ddx=p.x-en.x,ddz=p.z-en.y,d=Math.hypot(ddx,ddz);
    if(d>90){var s=findSpot(35,60);en.x=s.x;en.y=s.y;return;}
    var dir=en.dir,esp=2.5;
    if(d<18&&los(en.x,en.y,p.x,p.z)){
      dir=Math.atan2(ddz,ddx);esp=9.3+Math.min(2,level*.1);en.dir=dir;
    }else{
      en.dirT-=dt;if(en.dirT<=0){en.dir=Math.random()*6.28;en.dirT=1+Math.random()*1.5;}dir=en.dir;
    }
    var ex=en.x,ey=en.y;
    moveWithCollision(en,Math.cos(dir)*esp*dt,Math.sin(dir)*esp*dt,.3);
    if(en.x===ex&&en.y===ey){en.dir=Math.random()*6.28;en.dirT=1;}
    if(d<1.0&&dashT>0){killEnemy(en);msg(STR.msgDashSmash);buzz([60,30,80]);return;}
    if(d<.58&&p.iT<=0&&dashT<=0){
      time=Math.max(0,time-5);p.iT=1.6;killEnemy(en);
      flashRed();addTrauma(.85);hurtV=1;
      msg(STR.msgHurt);playHurtSFX();buzz([100,50,150]);
    }
  });
  for(var i=projs.length-1;i>=0;i--){
    var pr=projs[i];pr.x+=pr.vx*dt;pr.y+=pr.vy*dt;pr.z+=pr.vz*dt;pr.life-=dt;
    var dead=pr.life<=0||pr.y<0||pr.y>WALL_H||cell(pr.x,pr.z)===1;
    if(!dead)for(var j=0;j<enemies.length;j++){
      var en2=enemies[j];
      if(en2.alive&&(pr.x-en2.x)*(pr.x-en2.x)+(pr.z-en2.y)*(pr.z-en2.y)<.28&&Math.abs(pr.y-1)<1.2){killEnemy(en2);msg(STR.msgBoxHit);dead=true;break;}
    }
    if(!dead)for(var k=0;k<items.length;k++){
      var it2=items[k];
      if(!it2.taken&&(pr.x-it2.x)*(pr.x-it2.x)+(pr.z-it2.y)*(pr.z-it2.y)<.38){collect(it2);dead=true;break;}
    }
    if(dead){
      if(pr.mesh){worldRoot.remove(pr.mesh);pr.mesh.geometry.dispose();pr.mesh.material.dispose();}
      puff(pr.x,pr.y,pr.z,7,.9,.7,.2,2.2);
      projs.splice(i,1);
    }
  }
}

var joyVector={x:0,y:0};
function getJoyInput(){return joyVector;}

if(window.nipplejs){
  var manager=nipplejs.create({
    zone:$('joy-zone'),mode:'dynamic',color:'#d8b5ff',size:110,threshold:0.1,fadeTime:200
  });
  manager.on('move',function(evt,data){
    if(data&&data.vector){
      joyVector.x=data.vector.x;
      joyVector.y=data.vector.y;
    }
  });
  manager.on('end',function(){
    joyVector.x=0;joyVector.y=0;
  });
}else{
  var lkZone=$('joy-zone');
  var jTouchId=null,jStartX=0,jStartY=0;
  lkZone.addEventListener('pointerdown',function(e){
    if(jTouchId===null){jTouchId=e.pointerId;jStartX=e.clientX;jStartY=e.clientY;}
  });
  window.addEventListener('pointermove',function(e){
    if(e.pointerId===jTouchId){
      var dx=(e.clientX-jStartX)/50,dy=(e.clientY-jStartY)/50;
      var d=Math.hypot(dx,dy);if(d>1){dx/=d;dy/=d;}
      joyVector.x=dx;joyVector.y=-dy;
    }
  });
  function endJ(e){if(e.pointerId===jTouchId){jTouchId=null;joyVector.x=0;joyVector.y=0;}}
  window.addEventListener('pointerup',endJ);
  window.addEventListener('pointercancel',endJ);
}

var lookZone=$('look-zone'),lookId=null,lastLX=0,lastLY=0;
lookZone.addEventListener('pointerdown',function(e){
  if(lookId===null){lookId=e.pointerId;lastLX=e.clientX;lastLY=e.clientY;}
});
window.addEventListener('pointermove',function(e){
  if(e.pointerId===lookId){
    lookDX+=e.clientX-lastLX;lookDY+=e.clientY-lastLY;
    lastLX=e.clientX;lastLY=e.clientY;
  }
});
function endL(e){if(e.pointerId===lookId){lookId=null;}}
window.addEventListener('pointerup',endL);
window.addEventListener('pointercancel',endL);

$('sk-box').addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();throwBox();},{passive:false});
$('sk-nut').addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();eatNut();},{passive:false});
$('sk-dash').addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();doDash();},{passive:false});
var skJump=$('sk-jump');
skJump.addEventListener('pointerdown',function(e){
  e.preventDefault();e.stopPropagation();touchJump=true;jumpBufferTimer=0.15;
},{passive:false});
skJump.addEventListener('pointerup',function(){touchJump=false;});
skJump.addEventListener('pointercancel',function(){touchJump=false;});

window.addEventListener('keydown',function(e){
  keys[e.code]=true;
  if(e.code==='KeyQ')doDash();
  if(e.code==='Space'){e.preventDefault();jumpBufferTimer=0.15;}
});
window.addEventListener('keyup',function(e){keys[e.code]=false;});

var md=false,mxx=0,myy=0,moved=0;
renderer.domElement.addEventListener('mousedown',function(e){
  if(state!=='playing'||isTouch)return;
  if(e.button===2){eatNut();return;}
  if(e.button!==0)return;
  if(document.pointerLockElement===renderer.domElement){throwBox();return;}
  try{renderer.domElement.requestPointerLock&&renderer.domElement.requestPointerLock();}catch(err){}
  md=true;mxx=e.clientX;myy=e.clientY;moved=0;
});
window.addEventListener('mousemove',function(e){
  if(state!=='playing')return;
  if(document.pointerLockElement===renderer.domElement){
    p.yaw+=e.movementX*.0024;
    p.pitch=THREE.MathUtils.clamp(p.pitch-e.movementY*.002,-.55,1.1);
    return;
  }
  if(md){
    var dx=e.clientX-mxx,dy=e.clientY-myy;mxx=e.clientX;myy=e.clientY;
    moved+=Math.abs(dx)+Math.abs(dy);
    p.yaw+=dx*.004;
    p.pitch=THREE.MathUtils.clamp(p.pitch-dy*.003,-.55,1.1);
  }
});
window.addEventListener('mouseup',function(e){
  if(e.button===0&&md){md=false;if(moved<8&&document.pointerLockElement!==renderer.domElement)throwBox();}
});
document.addEventListener('contextmenu',function(e){e.preventDefault();});

$('screen-start').addEventListener('click',function(){if(state==='start'){initAudio();startRun();}});
$('btn-retry').addEventListener('click',function(){if(state==='lost'){initAudio();startRun();}});
setTimeout(function(){var b=$('blank');if(b)b.textContent=STR.blankFound;},900);
$('btn-fs').addEventListener('click',function(){
  var el=document.documentElement;
  if(document.fullscreenElement){document.exitFullscreen&&document.exitFullscreen();return;}
  var fn=el.requestFullscreen||el.webkitRequestFullscreen;if(fn)fn.call(el);
});

/* ==========================================================================
   MODULE 11: 视觉循环
   ========================================================================== */
var camRoll=0,fovCur=74,camDist=5.5;
var CAM_MAX=6.5,CAM_MIN=1.0;

function visuals(dt,now){
  if(state==='playing'){
    p.yaw+=lookDX*.0062;
    p.pitch=THREE.MathUtils.clamp(p.pitch-lookDY*.0045,-.55,1.1);
    lookDX=lookDY=0;
  }else{lookDX=lookDY=0;}

  flickT-=dt;
  if(flickT<=0){
    if(Math.random()<.1){flickT=.06+Math.random()*.2;flick=.25+Math.random()*.45;}
    else flickT=.12;
  }
  flick+=(1-flick)*Math.min(1,dt*12);

  rebuildChunks(false);
  floorMesh.position.set(p.x,0,p.z);
  fTex.offset.set((p.x-80)/2,(-p.z-80)/2);
  ceilMesh.position.set(p.x,WALL_H,p.z);
  cTex.offset.set((p.x-80)/2,(-p.z-80)/2);

  var hx=p.x,hy=p.y+1.45,hz=p.z;
  var cp=Math.cos(p.pitch),sp=Math.sin(p.pitch);
  var fx=Math.cos(p.yaw)*cp,fy=sp,fz=Math.sin(p.yaw)*cp;
  var want=CAM_MAX;
  for(var t=.4;t<want;t+=.2){
    var qx=hx-fx*t,qy=hy-fy*t,qz=hz-fz*t;
    if(cell(qx,qz)===1||qy<.3||qy>WALL_H-.25){want=Math.max(CAM_MIN,t-.2);break;}
  }
  camDist+=(want-camDist)*Math.min(1,dt*10);

  trauma=Math.max(0,trauma-dt*1.35);
  var shakeMag=trauma*trauma*0.35;
  var shakeX=(Math.random()-.5)*shakeMag;
  var shakeY=(Math.random()-.5)*shakeMag;
  var shakeRot=(Math.random()-.5)*shakeMag*.15;

  camDip*=1-Math.min(1,dt*6.5);

  var hs=Math.hypot(p.vx,p.vz);
  bobT+=dt*((p.grounded?2.4:1.2)+hs*(p.grounded?1.3:.35));
  var amp=p.grounded?Math.min(.06,.006+hs*.0055):Math.min(.024,.004+hs*.0018);
  var swx=Math.sin(bobT)*amp*.65,swy=Math.abs(Math.cos(bobT))*amp;
  var br=Math.sin(now*1.7)*.009*(hs<.6?1:.35);
  var fhl=Math.max(.001,Math.hypot(fx,fz)),rx=-fz/fhl,rz=fx/fhl;

  var cy=hy-fy*camDist+shakeY-camDip+swy+br;
  cy=Math.max(.35,Math.min(WALL_H-.3,cy));
  camera.position.set(hx-fx*camDist+shakeX+rx*swx,cy,hz-fz*camDist+rz*swx);
  camera.lookAt(hx+fx*.6+rx*swx*.25,hy+fy*.6+(swy+br)*.3,hz+fz*.6+rz*swx*.25);

  flash.position.copy(camera.position);
  flash.target.position.set(hx+fx*12,hy+fy*12-.6,hz+fz*12);
  flash.intensity=2.2*flick;
  headLamp.position.set(p.x,p.y+1.9,p.z);
  headLamp.intensity=1.2*flick;
  if(ceilLightMat)ceilLightMat.color.setRGB(1*flick,.86*flick,.66*flick);
  if(ceilGlowMat)ceilGlowMat.opacity=.22*flick;

  fovKick*=1-Math.min(1,dt*3.2);
  var fovT=74+Math.min(24,hs*1.2)+(dashT>0?10:0)+(nutT>0?5:0)+fovKick;
  fovCur+=(fovT-fovCur)*Math.min(1,dt*6.5);
  camera.fov=fovCur;camera.updateProjectionMatrix();

  var side=p.vx*rx+p.vz*rz;
  var bobRoll=Math.sin(bobT)*.014*Math.min(1,hs/6);
  camRoll+=(THREE.MathUtils.clamp(-side*.01,-.07,.07)-camRoll)*Math.min(1,dt*8.5);
  camera.rotateZ(camRoll+bobRoll+shakeRot);

  playerRoot.position.set(p.x,p.y,p.z);
  var targetYaw=hs>1?Math.atan2(p.vx,p.vz):Math.atan2(fx,fz);
  var dy=targetYaw-modelYaw;
  while(dy>Math.PI)dy-=6.283;while(dy<-Math.PI)dy+=6.283;
  modelYaw+=dy*Math.min(1,dt*10);
  playerRoot.rotation.y=modelYaw;
  playerRoot.rotation.z=THREE.MathUtils.clamp(-side*.015,-.16,.16);
  playerRoot.rotation.x=p.grounded?0:THREE.MathUtils.clamp(-p.vy*.022,-.28,.28);
  var squish=1.0-Math.min(.3,camDip*1.2);
  playerRoot.scale.set(1.0/Math.sqrt(squish),squish,1.0/Math.sqrt(squish));
  if(mixer)mixer.update(dt);

  for(var i=0;i<items.length;i++){
    var m=itemMeshes[i];if(!m)continue;
    var it=items[i];
    m.visible=!it.taken;m.position.set(it.x,0,it.y);
    if(!it.taken){m.position.y=Math.sin(now*2.2+it.ph)*.09;m.rotation.y+=dt*1.4;}
  }
  for(i=0;i<MAXEN;i++){
    var spr=enemySprites[i],gl=enemyGlows[i],en=enemies[i],on=!!en&&en.alive;
    spr.visible=on;gl.visible=on;
    if(on){
      var eyy=.9+.1*Math.sin(now*2.8+en.ph);
      spr.position.set(en.x,eyy,en.y);gl.position.set(en.x,eyy,en.y);
    }
  }
  for(i=0;i<projs.length;i++){
    if(projs[i].mesh)projs[i].mesh.position.set(projs[i].x,projs[i].y,projs[i].z);
  }
  stepParticles(dt);

  var rawYaw=(p.yaw-prevYaw)/Math.max(dt,1e-4);prevYaw=p.yaw;
  yawVelS+=(rawYaw-yawVelS)*Math.min(1,dt*8.5);
  var mb=0;
  mb+=THREE.MathUtils.clamp((hs-6)/24,0,.58);
  mb+=THREE.MathUtils.clamp(Math.abs(yawVelS)*.38,0,.48);
  if(dashT>0)mb+=.28;
  mb=Math.min(mb,.68);
  if(mbReset>0){mb=0;mbReset--;}
  accumUniforms.uMix.value=mb;accumUniforms.uSpeed.value=hs;accumUniforms.uYaw.value=yawVelS;accumUniforms.uDash.value=dashT>0?1:0;

  speedU+=(hs-speedU)*Math.min(1,dt*5.5);
  impactV*=1-Math.min(1,dt*4);
  gradeUniforms.uTime.value=now;gradeUniforms.uSpeed.value=speedU;gradeUniforms.uHurt.value=hurtV;gradeUniforms.uBoost.value=boostV;gradeUniforms.uImpact.value=impactV;
}

var hLevel=$('h-level'),hGoal=$('h-goal'),hTime=$('h-time'),hSpd=$('h-spd');
function fmt(t){var ts=Math.ceil(Math.max(0,t));return String(ts/60|0).padStart(2,'0')+':'+String(ts%60).padStart(2,'0');}
function setCd(el,frac){if(el)el.style.background=frac>0?'conic-gradient(rgba(0,0,0,.7) '+(frac*100)+'%,transparent 0)':'none';}
var cdBox=document.querySelector('#sk-box .cd'),cdNut=document.querySelector('#sk-nut .cd'),cdDash=document.querySelector('#sk-dash .cd');
var pb=$('pill-box'),pn=$('pill-nut'),pd=$('pill-dash');

function hud(){
  hLevel.textContent=level;
  var nd=1e9;
  for(var i=0;i<items.length;i++){
    if(items[i].taken)continue;
    var d=Math.hypot(p.x-items[i].x,p.z-items[i].y);
    if(d<nd)nd=d;
  }
  hGoal.textContent=goal+'/5'+(nd<1e8?' · '+Math.round(nd)+STR.hudMeterUnit:'');
  hTime.textContent=fmt(time);hTime.classList.toggle('low',time<15);
  hSpd.textContent=Math.hypot(p.vx,p.vz).toFixed(1)+STR.hudSpeedUnit+Math.round(p.x)+','+Math.round(p.z);
  setCd(cdBox,boxCD/.45);setCd(cdNut,nutCD/8);setCd(cdDash,dashCD/5);
  if(pb){
    pb.textContent=(boxCD>0?STR.pillBoxCd(boxCD.toFixed(1)):STR.pillBoxReady);
    pn.textContent=(nutT>0?STR.pillNutActive:nutCD>0?STR.pillNutCd(nutCD.toFixed(1)):STR.pillNutReady);
    pn.className='cd-pill '+(nutT>0?'act':'ready');
    pd.textContent=(dashT>0?STR.pillDashActive:dashCD>0?STR.pillDashCd(dashCD.toFixed(1)):STR.pillDashReady);
    pd.className='cd-pill '+(dashT>0?'act':'ready');
  }
}

function update(dt,now){
  if(window.TWEEN)TWEEN.update();
  if(state==='playing'){
    time-=dt;document.body.classList.toggle('danger',time<15);
    if(time<=0){time=0;lose();}
  }else{
    document.body.classList.remove('danger');
  }
  hud();
  if(state==='playing'){
    try{physics(dt);entities(dt);}catch(e){showErr(STR.errTagPhysics,e);}
    if(!toastShown&&isTouch){toastShown=true;var tt=$('toast');tt.classList.add('show');setTimeout(function(){tt.classList.remove('show');},4200);}
    
    if(ac){
      var hs=Math.hypot(p.vx,p.vz);
      if(windGain){
        var twg=(hs>8?Math.min(.18,(hs-8)*.014):0)+(dashT>0?.12:0);
        windGain.gain.setTargetAtTime(twg,ac.currentTime,.1);
        windFilter.frequency.setTargetAtTime(260+hs*48,ac.currentTime,.1);
      }
      if(skidGain){
        var isDrifting=(Math.abs(yawVelS)>1.4&&hs>7.5)||dashT>0;
        var tsg=isDrifting?Math.min(.16,Math.abs(yawVelS)*.035):0;
        skidGain.gain.setTargetAtTime(tsg,ac.currentTime,.08);
      }
      if(droneGain){
        droneGain.gain.setTargetAtTime(time<15?0.09:0.03,ac.currentTime,.2);
      }
    }
    hurtV*=1-Math.min(1,dt*2.4);
    boostV+=((nutT>0?1:0)-boostV)*Math.min(1,dt*4);
    gradeUniforms.uVig.value=.5+(time<15?.25+.16*Math.sin(now*7):0);
  }
  try{visuals(dt,now);}catch(e){showErr(STR.errTagRender,e);}
}

var frames=0,fpsT=0;
function loop(t){
  requestAnimationFrame(loop);
  var now=t/1000;var dt=Math.min(.05,now-last||.016);last=now;
  try{update(dt,now);}catch(e){showErr(STR.errTagFrame,e);}
  try{
    renderer.setRenderTarget(rtA);
    renderer.render(scene,camera);

    postQuad.material=accumMat;
    accumUniforms.tCur.value=rtA.texture;
    accumUniforms.tPrev.value=(accIdx===0?rtB:rtC).texture;
    renderer.setRenderTarget(accIdx===0?rtC:rtB);
    renderer.render(postScene,postCam);

    postQuad.material=gradeMat;
    gradeUniforms.tDiffuse.value=(accIdx===0?rtC:rtB).texture;
    renderer.setRenderTarget(null);
    renderer.render(postScene,postCam);
    accIdx=1-accIdx;
  }catch(e){
    renderer.setRenderTarget(null);renderer.render(scene,camera);showErr(STR.errTagPost,e);
  }
  frames++;
  if(now-fpsT>=.5){
    fps=Math.round(frames/(now-fpsT));frames=0;fpsT=now;
    $('diag').textContent=STR.diagDiagPrefix+state+' · '+fps+'fps · ∞'+(diagErr?' · ⚠ '+diagErr.slice(0,75)+(errCount>1?' ×'+errCount:''):'');
  }
}

function resize(){
  W=innerWidth;H=innerHeight;
  renderer.setSize(W,H);
  camera.aspect=W/H;camera.updateProjectionMatrix();
  renderer.getDrawingBufferSize(tmpV2);
  rtA.setSize(tmpV2.x,tmpV2.y);rtB.setSize(tmpV2.x,tmpV2.y);rtC.setSize(tmpV2.x,tmpV2.y);
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,250);});
if(window.visualViewport)visualViewport.addEventListener('resize',resize);

try{
  initWorld();
  setupLevel(1,true);
}catch(e){showErr(STR.errTagInit,e);}
requestAnimationFrame(function(t){last=t/1000;fpsT=last;requestAnimationFrame(loop);});
};
</script>

<!-- ==========================================================================
     MODULE 12: 多源容灾轮子加载器
     ========================================================================== -->
<script>
(function(){
  var diag=document.getElementById('diag');
  var S = window.GAME_STRINGS || {};
  function loadSeq(list,done){
    var i=0;
    (function next(){
      if(i>=list.length)return done(false);
      var s=document.createElement('script');
      s.src=list[i];
      s.onload=function(){done(true);};
      s.onerror=function(){if(s.parentNode)s.parentNode.removeChild(s);i++;next();};
      document.head.appendChild(s);
    })();
  }
  var CORE=[
    'https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js',
    'https://unpkg.com/three@0.147.0/build/three.min.js',
    'https://cdn.bootcdn.net/ajax/libs/three.js/0.147.0/three.min.js',
    'https://npm.elemecdn.com/three@0.147.0/build/three.min.js'
  ];
  var LOADER=[
    'https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js',
    'https://unpkg.com/three@0.147.0/examples/js/loaders/GLTFLoader.js'
  ];
  var NIPPLE=[
    'https://cdn.jsdelivr.net/npm/nipplejs@0.10.1/dist/nipplejs.min.js',
    'https://unpkg.com/nipplejs@0.10.1/dist/nipplejs.min.js'
  ];
  var TWEEN_LIB=[
    'https://cdn.jsdelivr.net/npm/@tweenjs/tween.js@18.6.4/dist/tween.umd.js',
    'https://unpkg.com/@tweenjs/tween.js@18.6.4/dist/tween.umd.js'
  ];

  diag.textContent=S.diagLoadingLibs||'Loading...';
  loadSeq(CORE,function(ok){
    if(!ok||!window.THREE){
      diag.textContent=S.diagCoreLibBlocked||'Three.js blocked';return;
    }
    loadSeq(LOADER,function(){
      loadSeq(NIPPLE,function(){
        loadSeq(TWEEN_LIB,function(){
          try{
            window.startGame();
          }catch(e){
            diag.textContent=(S.diagBootErrorPrefix||'Error: ')+((e&&e.message)||e);
          }
        });
      });
    });
  });
})();
</script>
